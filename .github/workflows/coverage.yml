name: Test Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest test/ --cov=ingen --cov-report=xml --cov-report=term --cov-fail-under=95 \
            --ignore=test/reader/test_json_reader.py \
            --ignore=test/reader/test_xml_file_reader.py \
            --ignore=test/reader/test_api_reader.py \
            --ignore=test/lib/test_cryptor.py \
            --ignore=test/data_source/test_api_source.py \
            -k "not (test_http_get_retry or test_http_retry_request_sends_none_when_success_criteria_fails or test_http_retry_when_retry_is_zero)"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
