name: InGen QC

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        echo 'numpy<2.0' > /tmp/constraints.txt
        echo 'pandas<3.0' >> /tmp/constraints.txt
        PIP_CONSTRAINT=/tmp/constraints.txt pip install -r requirements.txt
        PIP_CONSTRAINT=/tmp/constraints.txt pip install "great_expectations<0.18.0"
        pip install pytest pytest-cov coverage openpyxl mysql-connector-python
    - name: Run tests with coverage
      run: |
        pytest test/ --cov=ingen --cov-report=term-missing --junitxml=junit/test-results.xml || true
    - name: Enforce 95% coverage threshold
      run: |
        coverage report --fail-under=95
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results
        path: junit/test-results.xml
      if: ${{ always() }}
